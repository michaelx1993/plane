name: Agent Control Plane Fork Gate

on:
  push:
    branches:
      - preview
  pull_request:

jobs:
  fork-gate:
    name: Fork gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Agent Control Plane fork check
        run: bash .github/acp-plane-fork-check.sh
