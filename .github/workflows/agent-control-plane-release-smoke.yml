name: Agent Control Plane Release Smoke

on:
  pull_request:
    paths:
      - ".github/acp-plane-fork-check.sh"
      - ".github/acp-plane-release-image.sh"
      - ".github/acp-plane-rollback-smoke.sh"
      - ".github/acp-plane-release-smoke.sh"
      - ".github/workflows/agent-control-plane-release-smoke.yml"
      - "docs/agent-control-plane-fork.md"
      - "docker-compose.yml"
      - "deployments/cli/community/**"
      - "apps/**/Dockerfile*"
  workflow_dispatch:

jobs:
  release-smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release smoke
        run: bash .github/acp-plane-release-smoke.sh
